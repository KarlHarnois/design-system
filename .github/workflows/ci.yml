name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Run tests, typecheck and token lint
        run: nix flake check --print-build-logs
      - name: Build tokens
        run: nix build --print-build-logs
